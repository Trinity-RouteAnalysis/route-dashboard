<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>동시점 판매추이</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Trinity 계열: 로즈골드 · 옐로골드 · 화이트골드, 워드마크의 웜 차콜 */
  --rose:#C98F82;
  --gold:#C9A86A;
  --white-gold:#C7C3BE;
  --ground:#F7F4F0;
  --surface:#FFFFFF;
  --ink:#3B3530;
  --ink-2:#6A615A;
  --dim:#9B928A;
  --line:#E9E3DC;
  --line-strong:#D3C9BF;
  --accent:#9A5E54;
  --accent-ink:#FFFFFF;
  --accent-soft:#F5E8E4;
  --up:#B8392F;
  --down:#2E5CB5;
  --tint-total:#F7E7E2;
  --tint-sum:#F6EEDD;
  --tint-sub:#EFEDEA;
  --head:#4A433D;
  --head-ink:#F6F0E9;
  --head-2:#5A524B;
  --bar-cur:linear-gradient(90deg,#D6A396,#B9786B);
  --bar-prev:linear-gradient(90deg,#DCC79C,#C4A566);
  --brand:linear-gradient(90deg,#D9A99C 0%,#D8BD86 55%,#CFCBC6 100%);
  --shadow:0 1px 2px rgba(59,53,48,.05),0 4px 16px rgba(59,53,48,.05);
  --logo-ink:#686158;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191614;--surface:#221E1B;--ink:#F2ECE6;--ink-2:#CBC1B7;--dim:#978D84;
    --line:#37312C;--line-strong:#4B433C;--accent:#E2A99B;--accent-ink:#2B1A16;--accent-soft:#3A2A26;
    --up:#FF7B6F;--down:#8AAAFF;--tint-total:#3A2824;--tint-sum:#352E1F;--tint-sub:#2B2926;
    --head:#2B2622;--head-ink:#EFE7DF;--head-2:#352F2A;--logo-ink:#EFE7DF;
    --bar-cur:linear-gradient(90deg,#B9786B,#E2A99B);--bar-prev:linear-gradient(90deg,#9E8551,#D2B679);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --ground:#191614;--surface:#221E1B;--ink:#F2ECE6;--ink-2:#CBC1B7;--dim:#978D84;
  --line:#37312C;--line-strong:#4B433C;--accent:#E2A99B;--accent-ink:#2B1A16;--accent-soft:#3A2A26;
  --up:#FF7B6F;--down:#8AAAFF;--tint-total:#3A2824;--tint-sum:#352E1F;--tint-sub:#2B2926;
  --head:#2B2622;--head-ink:#EFE7DF;--head-2:#352F2A;--logo-ink:#EFE7DF;
  --bar-cur:linear-gradient(90deg,#B9786B,#E2A99B);--bar-prev:linear-gradient(90deg,#9E8551,#D2B679);
  --shadow:none;
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.app{max-width:1680px;margin:0 auto;padding-inline:20px;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px}
.logo{color:var(--logo-ink);line-height:0;margin-top:2px}
.logo-svg{display:block;height:40px;width:auto;max-width:100%}
@media (max-width:640px){.logo{order:-1;width:100%}.logo-svg{height:26px}}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand h1::after{content:"";display:block;width:64px;height:3px;border-radius:2px;margin-top:6px;background:var(--brand)}
.meta{margin:4px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--ink-2);font-size:13px}
.meta b{color:var(--ink);font-weight:600}
.cap{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.02em;padding:2px 8px;border-radius:4px;background:var(--head);color:var(--head-ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:not([aria-selected="true"]):hover{background:var(--accent-soft);color:var(--ink)}
.note{margin:0;font-size:12.5px;color:var(--ink-2)}

/* ---------- filters ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.filters>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:8px 14px;font-weight:600;font-size:13px}
.filters>summary::-webkit-details-marker{display:none}
.filters>summary .st{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.filters>summary .sum-sel{font-weight:400;color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters>summary .how{font-weight:400;font-size:11.5px;color:var(--dim);white-space:nowrap}
.filters>summary .how b{font-weight:600;color:var(--ink-2)}
.filters>summary .chev{transition:transform .15s;color:var(--ink-2)}
.filters[open]>summary .chev{transform:rotate(180deg)}
.fbody{display:flex;flex-direction:column;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 0}
.fgroup{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;min-width:0}
.frow .fgroup+.fgroup{margin-left:18px;padding-left:18px;border-left:1px solid var(--line)}
.fgroup.grow{flex:1 1 520px}
.flabel{min-width:52px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.capval{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.02em;padding:2px 8px;border-radius:4px;background:var(--head);color:var(--head-ink)}
.fglobal{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding-left:18px}
.fglobal button{font-size:11.5px;cursor:pointer;border-radius:999px;padding:2px 10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:500}
.fglobal button.multi[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.fglobal button.reset{color:var(--accent);font-weight:600}
.fglobal button.reset:disabled{color:var(--dim);cursor:default;border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;line-height:1.35}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="false"]{color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chips.is-all .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--line-strong);color:var(--ink)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:8px;padding:2px 9px;background:var(--surface);width:190px;max-width:100%}
.search input{border:0;outline:0;background:transparent;width:100%;font-family:var(--mono);font-size:12px;padding:2px 0}
@media (max-width:760px){.filters>summary .how{display:none}}
.hint{font-size:11.5px;color:var(--dim);margin:0}

/* ---------- summary ---------- */
.summary{display:flex;flex-direction:column;gap:8px}
.summary h2{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.summary h2 b{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px}
.card .mon{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink)}
.card .mon small{font-size:11.5px;font-weight:500;color:var(--dim)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0}
.kpi{display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi+.kpi{padding-left:14px;border-left:1px solid var(--line)}
.kpi:first-child{padding-right:14px}
.kpi .lab{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-2)}
.kpi .val{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.kpi .num{font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .num small{font-size:13px;font-weight:600;margin-left:1px;color:var(--ink-2)}
.kpi .chg{display:flex}
.kpi .was{margin-top:auto;padding-top:6px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.lf{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.lf .bar{position:relative;height:6px;border-radius:3px;background:var(--line)}
.lf .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.lf .bar.cur i{background:var(--bar-cur)}
.lf .bar.prev{height:4px}
.lf .bar.prev i{background:var(--bar-prev)}
.sub{display:flex;flex-direction:column;gap:3px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.subrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.subrow.prevrow{color:var(--dim)}
.sub b{color:var(--ink);font-weight:600}
.sub .gr{font-weight:700}
.sub .gr.up{color:var(--up)}.sub .gr.down{color:var(--down)}.sub .gr.flat{color:var(--dim)}
.sub .sep{color:var(--line-strong)}
.pill{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.pill.down{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.pill.flat{color:var(--dim);background:color-mix(in srgb,var(--dim) 12%,transparent)}

/* ---------- table ---------- */
.tablebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.tablebar .count{font-size:12.5px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line-strong)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:auto;max-height:78vh;overscroll-behavior:contain}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:12.5px;min-width:100%}
.grid th,.grid td{padding:0 8px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}
.grid thead th{position:sticky;background:var(--head);color:var(--head-ink);font-weight:600;text-align:center;z-index:3;border-bottom:1px solid var(--head-2)}
.grid thead tr.h1 th{top:0;height:30px;font-size:12.5px;box-shadow:inset 0 3px 0 -1px transparent}
.tablewrap{border-top:3px solid transparent;background-image:linear-gradient(var(--surface),var(--surface)),var(--brand);background-origin:border-box;background-clip:padding-box,border-box}
.grid thead tr.h2 th{top:30px;height:28px;font-size:11.5px;font-weight:500;background:var(--head-2)}
.grid thead tr.h3 th{top:58px;height:28px;font-size:11.5px;font-weight:500;background:var(--head-2)}
.grid thead th.lab{left:0;z-index:5;text-align:left}
.grid thead th.gs{border-left:2px solid var(--ground)}
.grid thead tr.h1 th .gnote{display:block;font-size:10.5px;font-weight:400;opacity:.75;line-height:1.1}
.grid td{height:24px;background:var(--surface)}
.grid td.c-route,.grid td.c-year,.grid td.c-mon{position:sticky;z-index:2;text-align:left}
.grid td.c-route{left:0;min-width:124px;max-width:124px;font-family:var(--mono);font-size:12px;font-weight:600;vertical-align:top;padding-top:5px;border-right:1px solid var(--line)}
.grid td.c-year{left:124px;min-width:54px;text-align:center;font-weight:700;vertical-align:middle;border-right:1px solid var(--line)}
.grid td.c-mon{left:178px;min-width:40px;text-align:center;color:var(--dim);border-right:1px solid var(--line-strong)}
.grid thead th.l1{left:0;min-width:124px}
.grid thead th.l2{left:124px;min-width:54px}
.grid thead th.l3{left:178px;min-width:40px}
.grid td.gs{border-left:2px solid var(--line-strong)}
.grid tr.bstart td{border-top:2px solid var(--line-strong)}
.grid tr.ystart td:not(.c-route){border-top:1px solid var(--line-strong)}
.grid tr.bstart td{border-top:2px solid var(--line-strong)}
.grid .k-total td{background:var(--tint-total)}
.grid .k-sum td{background:var(--tint-sum)}
.grid .k-sub td{background:var(--tint-sub)}
.grid .k-total td.c-route,.grid .k-sum td.c-route,.grid .k-sub td.c-route{font-family:var(--font);font-size:12.5px;font-weight:700}
.grid tr.y-prev td:not(.c-route):not(.c-mon){color:var(--dim)}
.grid tr.y-cur td:not(.c-route):not(.c-mon){color:var(--ink);font-weight:600}
.grid tr.y-yoy td{font-size:11.5px}
.grid tr.y-yoy td.c-year{font-size:12px}
.grid td.up{color:var(--up)!important;font-weight:600}
.grid td.down{color:var(--down)!important;font-weight:600}
.grid td.flat{color:var(--dim)}
.hide-u34 .g-u34,.hide-type .g-type,.hide-chan .g-chan,.hide-all .g-all{display:none}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
footer{font-size:12px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 16px}

@media (max-width:640px){
  .app{padding-inline:16px}
  .brand h1{font-size:20px}
  .grid td.c-route{min-width:96px;max-width:96px;font-size:11px}
  .grid td.c-year{left:96px;min-width:46px}
  .grid td.c-mon{left:142px}
  .grid thead th.l1{min-width:96px}
  .grid thead th.l2{left:96px;min-width:46px}
  .grid thead th.l3{left:142px}
}
/* ---------- password lock ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:12vh 24px}
.lockcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.lockcard h1{margin:0;font-size:20px;font-weight:700}
.lockcard p{margin:0;font-size:13px;color:var(--ink-2)}
.lockcard label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.lockcard input[type=password]{border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;background:var(--surface);font-size:15px}
.lockcard .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.lockcard button{border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.lockcard button:disabled{opacity:.6;cursor:wait}
.lockcard .err{color:var(--up);font-size:12.5px;font-weight:600;min-height:1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="lock" id="lock" hidden>
  <form class="lockcard" id="lockform" autocomplete="off">
    <h1>동시점 판매추이</h1>
    <p>공유받은 비밀번호를 입력하면 대시보드가 열립니다.</p>
    <label class="field" for="pw">비밀번호<input id="pw" type="password" required autofocus></label>
    <label class="row" for="remember"><input id="remember" type="checkbox"> 이 기기에서 비밀번호 기억하기</label>
    <button type="submit" id="unlock">열기</button>
    <p class="err" id="lockerr" role="alert"></p>
  </form>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>동시점 판매추이</h1>
      <p class="meta" id="meta"></p>

// facts: [노선, 대노선, 연도(0=직전,1=최신), 출발월, 발매일, 3/4수요, INDV/GRP, 채널, 발매건수, 발매수입, 발매율합, 운항편수, 공급석]
const FI = {route:0, daero:1, year:2, mon:3, date:4, u34:5, type:6, chan:7, n:8, rev:9, rate:10, fl:11, st:12};
const U34_ITEMS  = ["3수요","4수요"];
const TYPE_ITEMS = ["GRP","INDV"];
const CHAN_ITEMS = ["BSP/OTA","홈페이지","기타"];

function prepare(ds){
  const byRoute = new Map();
  for (const f of ds.facts){
    let a = byRoute.get(f[0]); if(!a){ a=[]; byRoute.set(f[0], a); } a.push(f);
  }
  const ix = arr => Object.fromEntries(arr.map((v,i)=>[v,i]));
  return {
    ds, byRoute,
    routeIx: ix(ds.dims.route), u34Ix: ix(ds.dims.u34), typeIx: ix(ds.dims.type), chanIx: ix(ds.dims.chan),
    months: [...new Set(ds.facts.map(f=>f[3]))].sort((a,b)=>a-b),
  };
}

const blankish = v => v == null || v === 0;
const div = (a,b) => (a == null || b == null || b === 0) ? null : a / b;

function sum(F, y, field, pred){
  let s = 0, hit = false;
  for (const f of F){ if (f[2] !== y || (pred && !pred(f))) continue; hit = true; s += f[field]; }
  return hit ? s : null;
}
function mx(F, y, field){
  let m = null;
  for (const f of F){ if (f[2] !== y) continue; const v = f[field]; if (v < 0) continue; m = (m == null) ? v : Math.max(m, v); }
  return m;
}

// DAX: IF(당해 BLANK/0, BLANK, SWITCH(연도, 직전값, 당해값, 전년비))
function simple(val, fmt, mode, fallback, pp){
  const c = val(1), p = val(0);
  if (blankish(c)) return null;
  const g = (blankish(p) || blankish(c)) ? fallback : (mode === "ratio" ? (c - p) / p : c - p);
  return {p, c, g, fmt, pp: !!pp};
}
// 비중: 채널값 / 전체, 전년비는 %p 차이, 둘 중 하나라도 0 이면 0
function share(ch, tot){
  const c1 = ch(1), c0 = ch(0);
  if (blankish(c1)) return null;
  const s1 = div(c1, tot(1)), s0 = div(c0, tot(0));
  const g = (blankish(c0) || blankish(c1)) ? 0 : (s1 - s0);
  return {p: s0, c: s1, g, fmt: "pct", pp: false};
}

function cellsFor(P, F){
  const all = [
    simple(y => mx(F, y, 11), "int", "ratio", 0),                          // 운항(편)
    simple(y => mx(F, y, 12), "int", "ratio", null),                       // 공급(석)
    simple(y => sum(F, y, 8), "int", "ratio", null),                       // 발매(석)
    simple(y => sum(F, y, 10), "pct", "diff", null, true),                 // 발매율(%)
    simple(y => div(sum(F, y, 9), sum(F, y, 8)), "int", "ratio", null),    // A/R(원)
    simple(y => sum(F, y, 9), "mil", "ratio", null),                       // 발매수입(백만원)
  ];
  const u34 = [];
  for (const item of U34_ITEMS){
    const k = P.u34Ix[item]; const pr = f => f[5] === k;
    u34.push(simple(y => sum(F, y, 8, pr), "int", "ratio", 0));
    u34.push(share(y => sum(F, y, 8, pr), y => sum(F, y, 8)));
  }
  const type = [];
  for (const item of TYPE_ITEMS){
    const k = P.typeIx[item]; const pr = f => f[6] === k;
    type.push(simple(y => sum(F, y, 8, pr), "int", "ratio", 0));
    type.push(share(y => sum(F, y, 8, pr), y => sum(F, y, 8)));
    type.push(simple(y => sum(F, y, 10, pr), "pct", "diff", null));
    type.push(simple(y => div(sum(F, y, 9, pr), sum(F, y, 8, pr)), "int", "ratio", 0));
  }
  const chan = [];
  const indv = P.typeIx["INDV"];
  for (const item of CHAN_ITEMS){
    const k = P.chanIx[item]; const pr = f => f[7] === k;
    chan.push(simple(y => sum(F, y, 8, pr), "int", "ratio", 0));
    chan.push(share(y => sum(F, y, 8, f => f[7] === k && f[6] === indv), y => sum(F, y, 8, f => f[6] === indv)));
    chan.push(simple(y => sum(F, y, 10, pr), "pct", "diff", null));
    chan.push(simple(y => div(sum(F, y, 9, pr), sum(F, y, 8, pr)), "int", "ratio", 0));
  }
  return {all, u34, type, chan};
}

function kindOf(name){
  if (name.replace(/\s/g,"") === "합계") return "total";
  if (/합계$/.test(name)) return "sum";
  if (/소계$/.test(name)) return "sub";
  return "route";
}

// sel: {daero:Set, mon:Set, date:Set}
function buildBlocks(P, sel){
  const D = P.ds.dims;
  const daeroOk = D.daero.map(n => sel.daero.has(n));
  const dateOk = D.date.map(n => sel.date.has(n));
  const blocks = [];
  for (const name of P.ds.master){
    const ri = P.routeIx[name]; if (ri == null) continue;
    const facts = (P.byRoute.get(ri) || []).filter(f => daeroOk[f[1]] && dateOk[f[4]] && sel.mon.has(f[3]));
    if (!facts.length) continue;
    const months = [...new Set(facts.map(f => f[3]))].sort((a,b)=>a-b);
    const rows = [];
    for (const m of months){
      const F = facts.filter(f => f[3] === m);
      const cells = cellsFor(P, F);
      if (cells.all.every(c => c == null)) continue;
      rows.push({m, cells});
    }
    if (rows.length) blocks.push({name, kind: kindOf(name), rows});
  }
  return blocks;
}

// 엑셀 표시형식과 같은 반올림 (15자리 정밀도 후 반올림)
const r15 = v => Math.round(Number(v.toPrecision(15)));
function fmtVal(v, fmt){
  if (v == null) return "";
  if (fmt === "pct") return r15(v * 100) + "%";
  if (fmt === "mil") return r15(v / 1e6).toLocaleString("en-US");
  return r15(v).toLocaleString("en-US");
}
function fmtGrowth(g, pp){
  if (g == null) return {t: "", k: ""};
  if (g === 0) return {t: "-", k: "flat"};
  const n = r15(Math.abs(g) * 100) + "%" + (pp ? "p" : "");
  return g > 0 ? {t: "▲" + n, k: "up"} : {t: "▼" + n, k: "down"};
}
function cellText(cell, which){
  if (cell == null) return {t: "", k: ""};
  if (which === 2) return fmtGrowth(cell.g, cell.pp);
  return {t: fmtVal(which === 0 ? cell.p : cell.c, cell.fmt), k: ""};
}

function defaultSel(P){

  return {
    year: new Set([ds.years[0], ds.years[1], "전년비"]),
    daero: new Set(ds.dims.daero),
    mon: new Set(P.months),

function setDataset(id){
  const ds = PAYLOAD.datasets.find(d => d.id === id) || PAYLOAD.datasets[PAYLOAD.datasets.length - 1];
  state.ds = ds; state.P = prepare(ds); state.sel = defaultSel(state.P);
  store.set("ds", ds.id);
  renderSwitch(); renderMeta(); renderFilters(); render();

function filterDefs(){
  const P = state.P, ds = state.ds;
  return [
    {key:"year",  label:"출발연도", items:[ds.years[0], ds.years[1], "전년비"]},
    {key:"daero", label:"대노선",   items: orderDaero(ds)},
    {key:"mon",   label:"출발월",   items: P.months, text: MONTH_TXT},
    {key:"date",  label:"발매일",   items: ds.dims.date.slice().sort()},
  ];
}
function orderDaero(ds){
  const pref = ["합계","국제선","국내선","일본노선","중국노선","대만노선","러시아/중앙아시아노선","동남아노선","대양주노선","유럽노선","미주"];
  const have = ds.dims.daero.filter(Boolean);
  return pref.filter(p => have.includes(p)).concat(have.filter(h => !pref.includes(h)));
}

function renderFilters(){
  const defs = filterDefs();
  const byKey = Object.fromEntries(defs.map(d => [d.key, d]));
  const slicer = (key, cls) => {
    const d = byKey[key];
    const all = d.items.every(i => state.sel[key].has(i));
    return `<div class="fgroup${cls ? " " + cls : ""}"><span class="flabel">${d.label}</span>` +
      `<div class="chips${all ? " is-all" : ""}">` +
      d.items.map((it, i) => `<button type="button" class="chip" id="f-${key}-${i}" data-f="${key}" data-v="${esc(it)}" aria-pressed="${state.sel[key].has(it)}">${esc(d.text ? d.text(it) : it)}</button>`).join("") +
      `</div></div>`;
  };
  // 발매일: 한 주치만 있으면 CAPTURE DATE 표시, 여러 주가 쌓였으면(--append) 슬라이서로
  const dates = byKey.date.items;
  const capture = dates.length > 1
    ? slicer("date").replace(`<span class="flabel">${byKey.date.label}</span>`, `<span class="flabel">CAPTURE DATE</span>`)
    : `<div class="fgroup"><span class="flabel">CAPTURE DATE</span><span class="capval">${esc(dates[0] || state.ds.capture)}</span></div>`;
  const allSelected = ["year", "mon", "daero", "date"].every(k => byKey[k].items.every(i => state.sel[k].has(i)));
  const global = `<div class="fglobal">` +
    `<button type="button" class="multi" id="multiAll" aria-pressed="${state.multiAll}" title="켜면 누르는 항목이 추가/제외됩니다 (Ctrl+클릭과 같음)">다중 선택</button>` +
    `<button type="button" class="reset" id="resetAll" ${allSelected ? "disabled" : ""} title="모든 슬라이서 필터 해제">전체 선택</button></div>`;
  const view = `<div class="fgroup"><span class="flabel">표시 영역</span><div class="chips">` +
    GROUPS.map(g => `<button type="button" class="chip" id="v-${g.id}" data-view="${g.id}" aria-pressed="${state.view.has(g.id)}">${g.title}</button>`).join("") +
    `</div></div>`;
  const search = `<div class="fgroup"><span class="flabel">노선 찾기</span>` +
    `<label class="search" title="소계·합계 줄은 검색과 상관없이 항상 보입니다"><span aria-hidden="true">⌕</span>` +
    `<input id="q" type="search" placeholder="예: ICN-FUK, NRT" value="${esc(state.q)}" autocomplete="off"></label></div>`;
  document.getElementById("fbody").innerHTML = switchHtml() +
    `<div class="frow">${slicer("year")}${slicer("mon")}${capture}${global}</div>` +
    `<div class="frow">${slicer("daero", "grow")}${search}</div>` +
    `<div class="frow">${view}</div>`;
  renderSelSummary();
}

function renderSelSummary(){
  const defs = filterDefs(), parts = [];
  for (const d of defs){
    const n = d.items.filter(i => state.sel[d.key].has(i)).length;
    if (n < d.items.length) parts.push(`${d.label} ${n}/${d.items.length}`);
  }
  document.getElementById("selSummary").textContent = parts.length ? "필터: " + parts.join(" · ") : "전체 선택됨";
}

function render(){
  const {P, sel} = state;
  const blocks = buildBlocks(P, sel);
  const q = state.q.trim().toLowerCase();
  const shown = q ? blocks.filter(b => b.kind !== "route" || b.name.toLowerCase().includes(q)) : blocks;
  const years = [[0, state.ds.years[0], "y-prev"], [1, state.ds.years[1], "y-cur"], [2, "전년비", "y-yoy"]]
    .filter(y => sel.year.has(y[1]));
  const grid = document.getElementById("grid");
  grid.className = "grid " + GROUPS.filter(g => !state.view.has(g.id)).map(g => "hide-" + g.id).join(" ");
  renderHead();

  let body = "";
  for (const b of shown){
    const nm = b.rows.length, span = nm * years.length;
    years.forEach(([yi, ylabel, ycls], yk) => {
      b.rows.forEach((r, mk) => {
        const trc = [ "k-" + b.kind, ycls, (yk === 0 && mk === 0) ? "bstart" : "", mk === 0 ? "ystart" : "" ].join(" ");
        let tr = `<tr class="${trc}">`;
        if (yk === 0 && mk === 0) tr += `<td class="c-route" rowspan="${span}">${esc(b.name)}</td>`;
        if (mk === 0) tr += `<td class="c-year" rowspan="${nm}">${esc(ylabel)}</td>`;
        tr += `<td class="c-mon">${MONTH_TXT(r.m)}</td>`;
        for (const g of GROUPS){
          const cells = r.cells[g.id];
          cells.forEach((cell, ci) => {
            const x = cellText(cell, yi);
            const gs = ci === 0 ? " gs" : "";
            tr += `<td class="g-${g.id}${gs}${x.k ? " " + x.k : ""}">${x.t}</td>`;
          });
        }
        body += tr + "</tr>";
      });
    });
  }
  document.getElementById("tbody").innerHTML = body;
  document.getElementById("empty").hidden = shown.length > 0 && years.length > 0;
  const nRoutes = shown.filter(b => b.kind === "route").length;
  document.getElementById("count").textContent =
    `노선 ${nRoutes}개 · 소계/합계 ${shown.length - nRoutes}개 · 월 ${[...sel.mon].length}개`;
  renderSummary(blocks);
  renderSelSummary();
}

function renderHead(){
  let h1 = `<tr class="h1"><th class="lab l1" rowspan="3">노선</th><th class="lab l2" rowspan="3">연도</th><th class="lab l3" rowspan="3">월</th>`;
  let h2 = `<tr class="h2">`, h3 = `<tr class="h3">`;
  for (const g of GROUPS){
    const n = g.subs.length * g.cols.length;
    h1 += `<th class="g-${g.id} gs" colspan="${n}">${g.title}${g.note ? `<span class="gnote">${g.note}</span>` : ""}</th>`;
    g.subs.forEach(s => {
      if (s) h2 += `<th class="g-${g.id} gs" colspan="${g.cols.length}">${esc(s[1])}</th>`;
      g.cols.forEach((c, ci) => {
        if (!s) h2 += `<th class="g-${g.id}${ci === 0 ? " gs" : ""}" rowspan="2">${c}</th>`;
        else h3 += `<th class="g-${g.id}${ci === 0 ? " gs" : ""}">${c}</th>`;
      });
    });
  }
  document.getElementById("thead").innerHTML = h1 + "</tr>" + h2 + "</tr>" + h3 + "</tr>";
}

function renderSummary(blocks){
  const el = document.getElementById("summary");
  const b = blocks.find(x => x.kind === "total") || blocks[0];
  if (!b){ el.innerHTML = ""; return; }
  const ds = state.ds, py = esc(ds.years[0]);
  const pill = (g, pp) => { const x = fmtGrowth(g, pp); return `<span class="pill ${x.k || "flat"}">${x.t || "–"}</span>`; };
  const pctW = v => v == null ? 0 : Math.max(0, Math.min(100, v * 100));
  const cards = b.rows.map(r => {
    const [, seat, sales, rate, ar] = r.cells.all;
    if (!sales && !rate && !ar) return "";
    const rateHtml = rate ? `
      <div class="kpi">
        <span class="lab">발매율</span>
        <span class="val"><span class="num">${fmtVal(rate.c, "pct").replace("%", "")}<small>%</small></span></span>
        <span class="chg">${pill(rate.g, true)}</span>
        <span class="lf" aria-hidden="true">
          <span class="bar cur"><i style="width:${pctW(rate.c)}%"></i></span>
          <span class="bar prev"><i style="width:${pctW(rate.p)}%"></i></span>
        </span>
        <span class="was">${py} 동시점 ${fmtVal(rate.p, "pct") || "–"}</span>
      </div>` : `<div class="kpi"><span class="lab">발매율</span><span class="was">–</span></div>`;
    const arHtml = ar ? `
      <div class="kpi">
        <span class="lab">A/R</span>
        <span class="val"><span class="num">${fmtVal(ar.c, "int")}<small>원</small></span></span>
        <span class="chg">${pill(ar.g, false)}</span>
        <span class="was">${py} 동시점 ${fmtVal(ar.p, "int") || "–"}원</span>
      </div>` : `<div class="kpi"><span class="lab">A/R</span><span class="was">–</span></div>`;
    const sg = sales ? fmtGrowth(sales.g, false) : {t: "", k: ""};
    const seatG = seat ? fmtGrowth(seat.g, false) : {t: "", k: ""};
    const gr = x => `<span class="gr ${x.k || "flat"}">${x.t || "–"}</span>`;
    const subHtml = (sales || seat) ? `
      <div class="sub">
        <div class="subrow"><span>공급 <b>${seat ? fmtVal(seat.c, "int") : "–"}</b>석 ${gr(seatG)}</span>
          <span class="sep">|</span>
          <span>발매 <b>${sales ? fmtVal(sales.c, "int") : "–"}</b>석 ${gr(sg)}</span></div>
        <div class="subrow prevrow"><span>${py} 공급 ${seat ? (fmtVal(seat.p, "int") || "–") : "–"}석</span>
          <span class="sep">|</span>
          <span>${py} 발매 ${sales ? (fmtVal(sales.p, "int") || "–") : "–"}석</span></div>
      </div>` : "";
    return `<div class="card"><div class="mon"><span>${MONTH_TXT(r.m)} 출발</span><small>${esc(ds.years[1])} vs ${py}</small></div>` +
      `<div class="kpis">${rateHtml}${arHtml}</div>${subHtml}</div>`;
  }).join("");
  el.innerHTML = `<h2><b>${esc(b.name.replace(/\s+/g, " "))}</b> · 동시점 비교 (막대: 발매율 0–100%, 위 ${esc(ds.years[1])} · 아래 ${py})</h2><div class="cards">${cards}</div>`;
}

/* ---------- events ---------- */
document.getElementById("fbody").addEventListener("click", e => {
  const dsb = e.target.closest("button[data-ds]");
  if (dsb){ if (dsb.dataset.ds !== state.ds.id) setDataset(dsb.dataset.ds); return; }
  const chip = e.target.closest("button[data-f]");
  if (chip){
    const key = chip.dataset.f, set = state.sel[key];
    const def = filterDefs().find(d => d.key === key);
    const val = def.items.find(i => String(i) === chip.dataset.v);
    const additive = e.ctrlKey || e.metaKey || state.multiAll;
    if (additive){                                   // Ctrl+클릭 / 다중 선택: 켜고 끄기
      if (set.has(val)){
        set.delete(val);
        if (set.size === 0) def.items.forEach(i => set.add(i));   // 모두 해제하면 다시 전체
      } else set.add(val);
    } else {                                         // 그냥 클릭: 엑셀처럼 그 항목만
      set.clear(); set.add(val);
    }
    renderFilters(); render(); return;
  }
  if (e.target.closest("#multiAll")){
    state.multiAll = !state.multiAll;
    renderFilters(); return;
  }
  if (e.target.closest("#resetAll")){
    for (const d of filterDefs()) d.items.forEach(i => state.sel[d.key].add(i));
    renderFilters(); render(); return;
  }
  const v = e.target.closest("button[data-view]");
  if (v){
    const id = v.dataset.view;
    if (state.view.has(id)){ if (state.view.size > 1) state.view.delete(id); } else state.view.add(id);
    store.set("view", [...state.view]);
    renderFilters(); render();
  }
});
let qTimer = null;
document.getElementById("fbody").addEventListener("input", e => {
  if (e.target.id !== "q") return;
  state.q = e.target.value;
  clearTimeout(qTimer); qTimer = setTimeout(render, 120);
});

function start(){
  document.getElementById("lock").hidden = true;
  document.getElementById("app").hidden = false;
  const v = store.get("view");
  if (Array.isArray(v) && v.length) state.view = new Set(v.filter(x => GROUPS.some(g => g.id === x)));
  const saved = store.get("ds");
  const id = PAYLOAD.datasets.some(d => d.id === saved) ? saved : PAYLOAD.datasets[PAYLOAD.datasets.length - 1].id;
  setDataset(id);
}

/* ---------- 비밀번호 잠금 (GitHub 게시용) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(pw){
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv)}, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function tryUnlock(pw, remember){
  PAYLOAD = await decryptPayload(pw);
  try { remember ? localStorage.setItem("dsj:pw", pw) : localStorage.removeItem("dsj:pw"); } catch(e){}
  start();
}

(function boot(){
  if (PAYLOAD){ start(); return; }
  const app = document.getElementById("app"), lock = document.getElementById("lock");
  app.hidden = true; lock.hidden = false;
  const err = document.getElementById("lockerr"), btn = document.getElementById("unlock");
  if (!ENC){ err.textContent = "데이터가 없습니다."; btn.disabled = true; return; }
  if (!window.crypto || !crypto.subtle){
    err.textContent = "이 브라우저에서는 열 수 없습니다. Chrome·Edge·Safari 최신 버전으로 열어주세요.";
    btn.disabled = true; return;
  }
  let saved = null;
  try { saved = localStorage.getItem("dsj:pw"); } catch(e){}
  if (saved){
    document.getElementById("remember").checked = true;
    tryUnlock(saved, true).catch(() => { try { localStorage.removeItem("dsj:pw"); } catch(e){} });
  }
  document.getElementById("pw").addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); document.getElementById("lockform").requestSubmit(); }
  });
  document.getElementById("lockform").addEventListener("submit", async e => {
    e.preventDefault();
    err.textContent = ""; btn.disabled = true; btn.textContent = "여는 중…";
    try {
      await tryUnlock(document.getElementById("pw").value, document.getElementById("remember").checked);
    } catch(ex){
      err.textContent = "비밀번호가 맞지 않습니다. 다시 입력해 주세요.";
      document.getElementById("pw").select();
    } finally { btn.disabled = false; btn.textContent = "열기"; }
  });
})();
</script>
